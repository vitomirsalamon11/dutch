<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dutch Listening Practice</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--s1:#1a1a1a;--s2:#222;--s3:#2a2a2a;
  --b1:#2e2e2e;--b2:#3a3a3a;
  --t1:#f0ede8;--t2:#9a9088;--t3:#554e48;
  --ac:#e8b86d;--ac2:#c4924a;--ac3:#2e2010;
  --a1c:#5a82c4;--a1bg:#0d1520;
  --a2c:#c45a9e;--a2bg:#200d18;
  --gn:#5a9e6f;--gnb:#0a1e12;--gnt:#7dd4a0;
  --rd:#c45a5a;--rdb:#1e0a0a;--rdt:#f4a0a0;
  --r:14px;--rs:9px;
}
body{background:var(--bg);color:var(--t1);font-family:'DM Mono',monospace;font-size:15px;min-height:100vh}
.page{display:none;min-height:100vh;padding:2rem 1.5rem;max-width:740px;margin:0 auto;flex-direction:column}
.page.on{display:flex}
.logo{font-family:'Fraunces',serif;font-size:2.4rem;font-weight:600;color:var(--ac);letter-spacing:-1px;line-height:1;margin-bottom:6px}
.logo em{color:var(--t3);font-weight:300;font-style:italic}
.sub{color:var(--t2);font-size:12px;margin-bottom:2rem}
.lbl{font-size:10px;color:var(--t3);letter-spacing:2.5px;text-transform:uppercase;margin:1.5rem 0 .75rem}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px}
.ccard{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:1rem;cursor:pointer;transition:.15s}
.ccard:hover{border-color:var(--ac2);background:var(--s2)}
.ccard.on{border-color:var(--ac);background:var(--ac3)}
.ccard .ic{font-size:1.3rem;display:block;margin-bottom:6px}
.ccard h3{font-family:'Fraunces',serif;font-weight:300;font-size:.9rem;margin-bottom:3px}
.ccard p{font-size:10px;color:var(--t2);line-height:1.5}
.lvl-row{display:flex;gap:8px;margin-bottom:4px}
.lvl-btn{flex:1;background:var(--s1);border:1px solid var(--b1);border-radius:var(--rs);padding:.65rem;cursor:pointer;transition:.15s;text-align:center;font-family:'DM Mono',monospace;font-size:12px;color:var(--t2)}
.lvl-btn:hover{border-color:var(--ac2)}
.lvl-btn.on{border-color:var(--ac);background:var(--ac3);color:var(--ac)}
.lvl-badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;margin-right:5px;font-weight:500;vertical-align:middle}
.a1{background:var(--a1bg);color:var(--a1c);border:1px solid var(--a1c)}
.a2{background:var(--a2bg);color:var(--a2c);border:1px solid var(--a2c)}
.mlist{display:flex;flex-direction:column;gap:7px}
.mbtn{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rs);padding:.85rem 1rem;cursor:pointer;text-align:left;transition:.15s;display:flex;align-items:flex-start;gap:10px}
.mbtn:hover{border-color:var(--ac2);background:var(--s2)}
.mbtn.on{border-color:var(--ac);background:var(--ac3)}
.mnum{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--ac);min-width:24px;line-height:1}
.mtit{font-size:13px;font-weight:500;margin-bottom:2px}
.mdsc{font-size:11px;color:var(--t2);line-height:1.5}
.srow{display:flex;gap:10px;align-items:flex-end;margin-top:1.5rem;flex-wrap:wrap}
.srow label{font-size:10px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:5px}
select{background:var(--s2);border:1px solid var(--b2);border-radius:var(--rs);padding:.5rem .85rem;color:var(--t1);font-family:'DM Mono',monospace;font-size:12px;outline:none;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ac);color:#160e00;border:none;border-radius:var(--rs);padding:.7rem 1.4rem;font-family:'DM Mono',monospace;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--ac2)}
.gbtn{background:transparent;color:var(--t2);border:1px solid var(--b2)}
.gbtn:hover{background:var(--s2);color:var(--t1)}
.sbtn{padding:.45rem .9rem;font-size:12px}
.tbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.2rem}
.back{background:none;border:none;color:var(--t3);cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;padding:4px 0;transition:.15s}
.back:hover{color:var(--t2)}
.qc{font-size:11px;color:var(--t3)}
.pw{background:var(--s2);border-radius:4px;height:3px;margin-bottom:1.5rem;overflow:hidden}
.pf{background:var(--ac);height:3px;border-radius:4px;transition:width .45s}
.ecard{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:1.5rem}
.etype{font-size:10px;color:var(--ac2);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.cpill{display:inline-block;font-size:9px;color:var(--t3);letter-spacing:1px;text-transform:uppercase;border:1px solid var(--b2);border-radius:5px;padding:2px 7px;margin-bottom:12px;margin-right:4px}
.azone{background:var(--s2);border-radius:var(--rs);padding:1.2rem 1rem .9rem;margin-bottom:1.2rem;display:flex;flex-direction:column;align-items:center;gap:9px}
.pbig{width:60px;height:60px;border-radius:50%;background:var(--ac);color:#160e00;border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:.15s}
.pbig:hover{background:var(--ac2);transform:scale(1.06)}
.pbtns{display:flex;gap:8px}
.pbtn{background:var(--s3);border:1px solid var(--b2);border-radius:var(--rs);padding:.4rem .85rem;color:var(--t2);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:.15s}
.pbtn:hover{border-color:var(--ac2);color:var(--ac)}
.ahint{font-size:10px;color:var(--t3)}
.tinp{width:100%;background:var(--s2);border:1.5px solid var(--b2);border-radius:var(--rs);padding:.8rem 1rem;color:var(--t1);font-family:'Fraunces',serif;font-size:1.2rem;font-weight:300;outline:none;transition:.15s;margin-bottom:1rem;caret-color:var(--ac)}
.tinp::placeholder{color:var(--t3);font-style:italic}
.tinp:focus{border-color:var(--ac2)}
.tinp.ok{border-color:var(--gn);background:var(--gnb)}
.tinp.bad{border-color:var(--rd);background:var(--rdb)}
.mcg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.mco{background:var(--s2);border:1px solid var(--b2);border-radius:var(--rs);padding:.8rem .9rem;cursor:pointer;font-size:12px;color:var(--t1);transition:.15s;text-align:left;font-family:'DM Mono',monospace;line-height:1.45}
.mco:hover:not(:disabled){border-color:var(--ac2);background:var(--s3)}
.mco:disabled{cursor:default}
.mco.ok{border-color:var(--gn)!important;background:var(--gnb)!important;color:var(--gnt)}
.mco.bad{border-color:var(--rd)!important;background:var(--rdb)!important;color:var(--rdt)}
.eprompt{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:300;color:var(--t1);line-height:1.55;margin-bottom:1.1rem;padding:.85rem 1rem;background:var(--s2);border-radius:var(--rs);border-left:3px solid var(--ac)}
.blbl{font-size:10px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.barea{min-height:54px;border:1px dashed var(--b2);border-radius:var(--rs);padding:8px 9px;display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px;background:var(--s2);align-content:flex-start}
.cbank{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:1rem}
.chip{background:var(--s3);border:1px solid var(--b2);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:'Fraunces',serif;font-size:.9rem;font-weight:300;color:var(--t1);transition:.1s;user-select:none}
.chip:hover{border-color:var(--ac);color:var(--ac)}
.chip.used{background:var(--ac3);border-color:var(--ac2);color:var(--ac)}
.chip.cok{background:var(--gnb);border-color:var(--gn);color:var(--gnt);cursor:default}
.chip.cbad{background:var(--rdb);border-color:var(--rd);color:var(--rdt);cursor:default}
.fb{border-radius:var(--rs);padding:.8rem 1rem;margin-bottom:1rem;font-size:13px;line-height:1.55}
.fb.ok{background:var(--gnb);border:1px solid var(--gn);color:var(--gnt)}
.fb.bad{background:var(--rdb);border:1px solid var(--rd);color:var(--rdt)}
.fb .rev{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:300;margin-top:5px;color:var(--t1)}
.arow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vocab-card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:2rem 1.5rem;text-align:center}
.eng-word{font-family:'Fraunces',serif;font-size:2.5rem;font-weight:300;color:var(--t1);margin-bottom:.4rem;line-height:1.2}
.eng-ctx{font-size:12px;color:var(--t3);margin-bottom:1.5rem;font-style:italic}
.vocab-inp{width:100%;background:var(--s2);border:1.5px solid var(--b2);border-radius:var(--rs);padding:.8rem 1rem;color:var(--t1);font-family:'Fraunces',serif;font-size:1.3rem;font-weight:300;outline:none;transition:.15s;text-align:center;caret-color:var(--ac);margin-bottom:1rem}
.vocab-inp::placeholder{color:var(--t3);font-style:italic}
.vocab-inp:focus{border-color:var(--ac2)}
.vocab-inp.ok{border-color:var(--gn);background:var(--gnb)}
.vocab-inp.bad{border-color:var(--rd);background:var(--rdb)}
.ewrap{display:flex;flex-direction:column;align-items:center;padding:2rem 0;gap:8px}
.escore{font-family:'Fraunces',serif;font-size:4.5rem;font-weight:600;color:var(--ac);line-height:1}
.emsg{color:var(--t2);font-size:12px}
.ebk{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:1.2rem 0;width:100%;max-width:320px}
.bki{background:var(--s2);border-radius:var(--rs);padding:.85rem;text-align:center}
.bkv{font-family:'Fraunces',serif;font-size:1.8rem;font-weight:300}
.bkl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:1.5px;margin-top:3px}
.ebtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div id="pg-home" class="page on">
  <div>
    <div class="logo">Dutch<em>practice</em></div>
    <div class="sub">1000+ sentences · A1 &amp; A2 levels · listening and vocabulary</div>
  </div>
  <div class="lbl">level</div>
  <div class="lvl-row">
    <button class="lvl-btn on" id="lvl-sve" onclick="selLvl('sve')">All levels</button>
    <button class="lvl-btn" id="lvl-A1" onclick="selLvl('A1')"><span class="lvl-badge a1">A1</span>Beginner</button>
    <button class="lvl-btn" id="lvl-A2" onclick="selLvl('A2')"><span class="lvl-badge a2">A2</span>Elementary</button>
  </div>
  <div class="lbl">category</div>
  <div class="cgrid" id="cgrid"></div>
  <div class="lbl">exercise type</div>
  <div class="mlist" id="mlist"></div>
  <div class="srow">
    <div>
      <label>questions per session</label>
      <select id="qcount">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="30">30</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </div>
    <button class="btn" onclick="startSession()">Start &rarr;</button>
  </div>
</div>
<div id="pg-ex" class="page">
  <div class="tbar">
    <button class="back" onclick="goHome()">&#8592; back</button>
    <div class="qc" id="qc">1 / 20</div>
  </div>
  <div class="pw"><div class="pf" id="pf" style="width:0%"></div></div>
  <div id="excontent"></div>
</div>
<div id="pg-end" class="page">
  <div class="ewrap">
    <div style="font-size:11px;color:var(--t3);letter-spacing:2px;text-transform:uppercase">session complete</div>
    <div class="escore" id="escore">0%</div>
    <div class="emsg" id="emsg"></div>
    <div class="ebk" id="ebk"></div>
    <div class="ebtns">
      <button class="btn" onclick="startSession()">Repeat</button>
      <button class="btn gbtn" onclick="goHome()">Settings</button>
    </div>
  </div>
</div>

  {id:2,num:"③",t:"Build a sentence",d:"You see English and arrange the Dutch words."},
  {id:3,num:"④",t:"Vocabulary EN to NL",d:"You see an English word and write it in Dutch."},
  {id:4,num:"⑤",t:"Mixed (recommended)",d:"Automatically rotates all four exercise types."}
];

var selCat = "sve";
var selMode = 4;
var selLvlVal = "sve";
var sess = null;
var curP = null;
var curV = null;
var answered = false;
var bAns = [];
var bWords = [];
var sessMode = 4;

var synth = window.speechSynthesis;
var nlVoice = null;

function initVoices() {
  var voices = synth.getVoices();
  for (var i = 0; i < voices.length; i++) {
    if (voices[i].lang === "nl-NL" || voices[i].lang.indexOf("nl") === 0) {
      nlVoice = voices[i]; break;
    }
  }
}
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = initVoices;
initVoices();
setTimeout(initVoices, 500);
setTimeout(initVoices, 2000);

function speak(text, rate) {
  rate = rate || 1.0;
  initVoices();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "nl-NL"; u.rate = rate; u.pitch = 1.0;
  if (nlVoice) u.voice = nlVoice;
  synth.speak(u);
}

function show(id) {
  var pages = document.querySelectorAll(".page");
  for (var i = 0; i < pages.length; i++) pages[i].classList.remove("on");
  document.getElementById(id).classList.add("on");
}

function goHome() {
  synth.cancel(); curP = null; curV = null; answered = false;
  show("pg-home");
}

function selLvl(v) {
  selLvlVal = v;
  document.getElementById("lvl-sve").classList.toggle("on", v === "sve");
  document.getElementById("lvl-A1").classList.toggle("on", v === "A1");
  document.getElementById("lvl-A2").classList.toggle("on", v === "A2");
}

function buildHome() {
  var cg = document.getElementById("cgrid");
  cg.innerHTML = "";
  for (var i = 0; i < CATS.length; i++) {
    (function(cat) {
      var d = document.createElement("div");
      d.className = "ccard" + (selCat === cat.id ? " on" : "");
      d.innerHTML = "<span class='ic'>" + cat.icon + "</span><h3>" + cat.label + "</h3><p>" + cat.desc + "</p>";
      d.onclick = function() { selCat = cat.id; buildHome(); };
      cg.appendChild(d);
    })(CATS[i]);
  }
  var ml = document.getElementById("mlist");
  ml.innerHTML = "";
  for (var j = 0; j < MODES.length; j++) {
    (function(m) {
      var b = document.createElement("button");
      b.className = "mbtn" + (selMode === m.id ? " on" : "");
      b.innerHTML = "<span class='mnum'>" + m.num + "</span><div><div class='mtit'>" + m.t + "</div><div class='mdsc'>" + m.d + "</div></div>";
      b.onclick = function() { selMode = m.id; buildHome(); };
      ml.appendChild(b);
    })(MODES[j]);
  }
}

function getPool() {
  var pool = DATA;
  if (selCat !== "sve") pool = pool.filter(function(p) { return p.c === selCat; });
  if (selLvlVal !== "sve") pool = pool.filter(function(p) { return p.l === selLvlVal; });
  return pool;
}

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = b[i]; b[i] = b[j]; b[j] = tmp;
  }
  return b;
}

function startSession() {
  synth.cancel(); initVoices();
  sessMode = selMode;
  if (sessMode === 3) {
    var vpool = shuffle(VOCAB);
    var n = Math.min(parseInt(document.getElementById("qcount").value), vpool.length);
    sess = {phrases:vpool.slice(0,n), idx:0, correct:0, total:n, isVocab:true};
  } else {
    var pool = shuffle(getPool());
    var n2 = Math.min(parseInt(document.getElementById("qcount").value), pool.length);
    if (n2 === 0) { alert("No sentences for that combination. Try All levels or All categories."); return; }
    sess = {phrases:pool.slice(0,n2), idx:0, correct:0, total:n2, isVocab:false};
  }
  show("pg-ex");
  renderQ();
}

function pickMode() {
  if (sessMode === 4) return Math.floor(Math.random() * 4);
  return sessMode;
}

function renderQ() {
  answered = false; bAns = []; bWords = [];
  var pct = Math.round(sess.idx / sess.total * 100);
  document.getElementById("pf").style.width = pct + "%";
  document.getElementById("qc").textContent = (sess.idx + 1) + " / " + sess.total;
  var mode = pickMode();
  var el = document.getElementById("excontent");
  if (mode === 3 || sess.isVocab) {
    curV = sess.phrases[sess.idx]; curP = null;
    renderVocab(el);
  } else {
    curP = sess.phrases[sess.idx]; curV = null;
    if (mode === 0) renderType(el);
    else if (mode === 1) renderMC(el);
    else renderBuilder(el);
  }
}

function lvlBadge(l) {
  return "<span class='lvl-badge " + (l === "A1" ? "a1" : "a2") + "'>" + l + "</span>";
}

function audioZoneHTML() {
  return "<div class='azone'>" +
    "<button class='pbig' onclick='speak(curP.d, 1.0)'>&#9654;</button>" +
    "<div class='pbtns'>" +
      "<button class='pbtn' onclick='speak(curP.d, 1.0)'>&#9654; normal</button>" +
      "<button class='pbtn' onclick='speak(curP.d, 0.6)'>&#9654; slow</button>" +
    "</div>" +
    "<div class='ahint'>click &#9654; to listen</div>" +
  "</div>";
}

function renderType(el) {
  el.innerHTML = "<div class='ecard'>" +
    "<div class='etype'>&#9312; type what you hear</div>" +
    lvlBadge(curP.l) + "<span class='cpill'>" + curP.c + "</span>" +
    audioZoneHTML() +
    "<div style='font-size:10px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px'>type in Dutch:</div>" +
    "<input class='tinp' id='tinp' type='text' placeholder='...' autocomplete='off' autocorrect='off' autocapitalize='off' spellcheck='false'>" +
    "<div id='fb'></div>" +
    "<div class='arow' id='arow'><button class='btn' onclick='checkType()'>Check</button></div>" +
  "</div>";
  var inp = document.getElementById("tinp");
  if (inp) { inp.focus(); inp.onkeydown = function(e) { if (e.key === "Enter") checkType(); }; }
}

function norm(s) {
  return s.toLowerCase().trim().replace(/[?.!,'"]/g, "").replace(/\s+/g, " ");
}

function checkType() {
  if (answered) return;
  var inp = document.getElementById("tinp");
  var val = inp ? inp.value.trim() : "";
  if (!val) return;
  var ok = norm(val) === norm(curP.d);
  answered = true;
  inp.classList.add(ok ? "ok" : "bad");
  inp.disabled = true;
  sess.correct += ok ? 1 : 0;
  showFB(ok, curP.d);
}

function renderMC(el) {
  var pool = selLvlVal !== "sve" ? DATA.filter(function(x){return x.l===selLvlVal;}) : DATA;
  var others = shuffle(pool.filter(function(x){return x.id!==curP.id;})).slice(0,3);
  var opts = shuffle([curP].concat(others));
  window._mcOpts = opts;
  var optsHTML = "";
  for (var i = 0; i < opts.length; i++) {
    optsHTML += "<button class='mco' id='mco" + i + "' onclick='checkMC(" + i + ")'>" + opts[i].e + "</button>";
  }
  el.innerHTML = "<div class='ecard'>" +
    "<div class='etype'>&#9313; audio &rarr; meaning</div>" +
    lvlBadge(curP.l) + "<span class='cpill'>" + curP.c + "</span>" +
    audioZoneHTML() +
    "<div style='font-size:10px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:9px'>choose the correct translation:</div>" +
    "<div class='mcg'>" + optsHTML + "</div>" +
    "<div id='fb'></div><div class='arow' id='arow'></div>" +
  "</div>";
}

function checkMC(idx) {
  if (answered) return;
  answered = true;
  var opts = window._mcOpts;
  var ok = opts[idx].id === curP.id;
  sess.correct += ok ? 1 : 0;
  var btns = document.querySelectorAll(".mco");
  for (var i = 0; i < btns.length; i++) {
    btns[i].disabled = true;
    if (opts[i].id === curP.id) btns[i].classList.add("ok");
    else if (i === idx && !ok) btns[i].classList.add("bad");
  }
  showFB(ok, curP.d);
}

function renderBuilder(el) {
  bWords = shuffle(curP.d.split(" ").map(function(w,i){return{w:w,oi:i};}));
  var bankHTML = "";
  for (var i = 0; i < bWords.length; i++) {
    bankHTML += "<button class='chip' id='bc" + i + "' onclick='bAdd(" + i + ")'>" + bWords[i].w + "</button>";
  }
  el.innerHTML = "<div class='ecard'>" +
    "<div class='etype'>&#9314; build a sentence</div>" +
    lvlBadge(curP.l) + "<span class='cpill'>" + curP.c + "</span>" +
    "<div class='eprompt'>" + curP.e + "</div>" +
    "<div class='blbl'>your answer:</div>" +
    "<div class='barea' id='barea'></div>" +
    "<div class='blbl'>words:</div>" +
    "<div class='cbank'>" + bankHTML + "</div>" +
    "<div id='fb'></div>" +
    "<div class='arow' id='arow'>" +
      "<button class='btn' onclick='checkBuilder()'>Check</button>" +
      "<button class='btn gbtn sbtn' onclick='bClear()'>Clear</button>" +
    "</div>" +
  "</div>";
}

function bAdd(i) {
  if (answered) return;
  var chip = document.getElementById("bc" + i);
  if (!chip || chip.classList.contains("used")) return;
  chip.classList.add("used"); bAns.push(i); bRender();
}
function bRemove(i) {
  if (answered) return;
  bAns = bAns.filter(function(x){return x!==i;});
  var bc = document.getElementById("bc" + i);
  if (bc) bc.classList.remove("used");
  bRender();
}
function bClear() {
  if (answered) return;
  bAns = [];
  var chips = document.querySelectorAll(".cbank .chip");
  for (var i = 0; i < chips.length; i++) chips[i].classList.remove("used");
  bRender();
}
function bRender() {
  var area = document.getElementById("barea");
  if (!area) return;
  var html = "";
  for (var i = 0; i < bAns.length; i++) {
    html += "<button class='chip used' onclick='bRemove(" + bAns[i] + ")'>" + bWords[bAns[i]].w + "</button>";
  }
  area.innerHTML = html;
}
function checkBuilder() {
  if (answered || !bAns.length) return;
  var attempt = bAns.map(function(i){return bWords[i].w;}).join(" ");
  var ok = norm(attempt) === norm(curP.d);
  answered = true;
  speak(curP.d, 1.0);
  var chips = document.querySelectorAll("#barea .chip");
  for (var i = 0; i < chips.length; i++) {
    chips[i].classList.remove("used");
    chips[i].classList.add(ok ? "cok" : "cbad");
  }
  sess.correct += ok ? 1 : 0;
  showFB(ok, curP.d);
}

function renderVocab(el) {
  el.innerHTML = "<div class='vocab-card'>" +
    "<div class='etype'>&#9315; vocabulary: English &rarr; Dutch</div>" +
    "<span class='cpill'>" + curV.cat + "</span>" +
    "<div class='eng-word'>" + curV.en + "</div>" +
    "<div class='eng-ctx'>write in Dutch:</div>" +
    "<input class='vocab-inp' id='vinp' type='text' placeholder='...' autocomplete='off' autocorrect='off' autocapitalize='off' spellcheck='false'>" +
    "<div id='fb'></div>" +
    "<div class='arow' id='arow' style='justify-content:center'><button class='btn' onclick='checkVocab()'>Check</button></div>" +
  "</div>";
  var inp = document.getElementById("vinp");
  if (inp) { inp.focus(); inp.onkeydown = function(e) { if (e.key === "Enter") checkVocab(); }; }
}

function checkVocab() {
  if (answered) return;
  var inp = document.getElementById("vinp");
  var val = inp ? inp.value.trim() : "";
  if (!val) return;
  var ok = norm(val) === norm(curV.nl);
  answered = true;
  inp.classList.add(ok ? "ok" : "bad");
  inp.disabled = true;
  sess.correct += ok ? 1 : 0;
  speak(curV.nl, 1.0);
  showFB(ok, curV.nl);
}

function showFB(ok, correct) {
  document.getElementById("fb").innerHTML = ok
    ? "<div class='fb ok'>&#10003; Correct!</div>"
    : "<div class='fb bad'>&#10007; Incorrect. Correct answer:<div class='rev'>" + correct + "</div></div>";
  var ar = document.getElementById("arow");
  ar.innerHTML = "";
  var nx = document.createElement("button");
  nx.className = "btn";
  nx.textContent = (sess.idx + 1 < sess.total) ? "Next →" : "Finish →";
  nx.onclick = nextQ;
  ar.appendChild(nx);
}

function nextQ() {
  sess.idx++;
  if (sess.idx >= sess.total) { showEnd(); return; }
  renderQ();
}

function showEnd() {
  var pct = Math.round(sess.correct / sess.total * 100);
  document.getElementById("escore").textContent = pct + "%";
  document.getElementById("emsg").textContent =
    pct >= 90 ? "Excellent! Almost a native speaker." :
    pct >= 70 ? "Well done! Keep it up." :
    pct >= 50 ? "Good start! Practice more." :
                "Keep going, you will improve!";
  document.getElementById("ebk").innerHTML =
    "<div class='bki'><div class='bkv'>" + sess.correct + "</div><div class='bkl'>correct</div></div>" +
    "<div class='bki'><div class='bkv'>" + (sess.total-sess.correct) + "</div><div class='bkl'>wrong</div></div>" +
    "<div class='bki'><div class='bkv'>" + sess.total + "</div><div class='bkl'>total</div></div>";
  show("pg-end");
}

buildHome();
</script>
</body>
</html>
