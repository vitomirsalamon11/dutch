<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nederlands Luisteren</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--s1:#1a1a1a;--s2:#222;--s3:#2a2a2a;
  --b1:#2e2e2e;--b2:#3a3a3a;
  --t1:#f0ede8;--t2:#9a9088;--t3:#554e48;
  --ac:#e8b86d;--ac2:#c4924a;--ac3:#2e2010;
  --gn:#5a9e6f;--gnb:#0a1e12;--gnt:#7dd4a0;
  --rd:#c45a5a;--rdb:#1e0a0a;--rdt:#f4a0a0;
  --r:14px;--rs:9px;
}
body{background:var(--bg);color:var(--t1);font-family:'DM Mono',monospace;font-size:15px;min-height:100vh}
.page{display:none;min-height:100vh;padding:2rem 1.5rem;max-width:700px;margin:0 auto;flex-direction:column}
.page.on{display:flex}
/* home */
.logo{font-family:'Fraunces',serif;font-size:2.6rem;font-weight:600;color:var(--ac);letter-spacing:-1px;line-height:1;margin-bottom:6px}
.logo em{color:var(--t3);font-weight:300;font-style:italic}
.sub{color:var(--t2);font-size:12px}
.lbl{font-size:10px;color:var(--t3);letter-spacing:2.5px;text-transform:uppercase;margin:1.8rem 0 .75rem}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
.ccard{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:1.1rem;cursor:pointer;transition:.15s}
.ccard:hover{border-color:var(--ac2);background:var(--s2)}
.ccard.on{border-color:var(--ac);background:var(--ac3)}
.ccard .ic{font-size:1.4rem;display:block;margin-bottom:7px}
.ccard h3{font-family:'Fraunces',serif;font-weight:300;font-size:.95rem;margin-bottom:3px}
.ccard p{font-size:10.5px;color:var(--t2);line-height:1.5}
.mlist{display:flex;flex-direction:column;gap:8px}
.mbtn{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rs);padding:.9rem 1.1rem;cursor:pointer;text-align:left;transition:.15s;display:flex;align-items:flex-start;gap:11px}
.mbtn:hover{border-color:var(--ac2);background:var(--s2)}
.mbtn.on{border-color:var(--ac);background:var(--ac3)}
.mnum{font-family:'Fraunces',serif;font-size:1.4rem;color:var(--ac);min-width:26px;line-height:1}
.mtit{font-size:13px;font-weight:500;margin-bottom:2px}
.mdsc{font-size:11px;color:var(--t2);line-height:1.5}
.srow{display:flex;gap:10px;align-items:flex-end;margin-top:1.5rem}
.srow label{font-size:10px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:6px}
select{background:var(--s2);border:1px solid var(--b2);border-radius:var(--rs);padding:.55rem .9rem;color:var(--t1);font-family:'DM Mono',monospace;font-size:12px;outline:none;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--ac);color:#160e00;border:none;border-radius:var(--rs);padding:.7rem 1.4rem;font-family:'DM Mono',monospace;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--ac2)}
.gbtn{background:transparent;color:var(--t2);border:1px solid var(--b2)}
.gbtn:hover{background:var(--s2);color:var(--t1)}
.sbtn{padding:.45rem .9rem;font-size:12px}
/* exercise */
.tbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.4rem}
.back{background:none;border:none;color:var(--t3);cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;padding:4px 0;transition:.15s}
.back:hover{color:var(--t2)}
.qc{font-size:11px;color:var(--t3)}
.pw{background:var(--s2);border-radius:4px;height:3px;margin-bottom:1.5rem;overflow:hidden}
.pf{background:var(--ac);height:3px;border-radius:4px;transition:width .45s}
.ecard{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);padding:1.5rem}
.etype{font-size:10px;color:var(--ac2);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.cpill{display:inline-block;font-size:9.5px;color:var(--t3);letter-spacing:1px;text-transform:uppercase;border:1px solid var(--b2);border-radius:5px;padding:2px 8px;margin-bottom:14px}
/* audio */
.azone{background:var(--s2);border-radius:var(--rs);padding:1.3rem 1.1rem 1rem;margin-bottom:1.3rem;display:flex;flex-direction:column;align-items:center;gap:10px}
.pbig{width:62px;height:62px;border-radius:50%;background:var(--ac);color:#160e00;border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:.15s}
.pbig:hover{background:var(--ac2);transform:scale(1.06)}
.pbig.spin{animation:pulse .9s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.pbtns{display:flex;gap:8px}
.pbtn{background:var(--s3);border:1px solid var(--b2);border-radius:var(--rs);padding:.45rem .9rem;color:var(--t2);font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;transition:.15s}
.pbtn:hover{border-color:var(--ac2);color:var(--ac)}
.ahint{font-size:10.5px;color:var(--t3)}
/* type */
.tinp{width:100%;background:var(--s2);border:1.5px solid var(--b2);border-radius:var(--rs);padding:.85rem 1rem;color:var(--t1);font-family:'Fraunces',serif;font-size:1.25rem;font-weight:300;outline:none;transition:.15s;margin-bottom:1rem;caret-color:var(--ac)}
.tinp::placeholder{color:var(--t3);font-style:italic}
.tinp:focus{border-color:var(--ac2)}
.tinp.ok{border-color:var(--gn);background:var(--gnb)}
.tinp.bad{border-color:var(--rd);background:var(--rdb)}
/* mc */
.mcg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.mco{background:var(--s2);border:1px solid var(--b2);border-radius:var(--rs);padding:.85rem 1rem;cursor:pointer;font-size:12.5px;color:var(--t1);transition:.15s;text-align:left;font-family:'DM Mono',monospace;line-height:1.45}
.mco:hover:not(:disabled){border-color:var(--ac2);background:var(--s3)}
.mco:disabled{cursor:default}
.mco.ok{border-color:var(--gn)!important;background:var(--gnb)!important;color:var(--gnt)}
.mco.bad{border-color:var(--rd)!important;background:var(--rdb)!important;color:var(--rdt)}
/* builder */
.eprompt{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:300;color:var(--t1);line-height:1.55;margin-bottom:1.2rem;padding:.9rem 1rem;background:var(--s2);border-radius:var(--rs);border-left:3px solid var(--ac)}
.blbl{font-size:10px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.barea{min-height:58px;border:1px dashed var(--b2);border-radius:var(--rs);padding:9px 10px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;background:var(--s2);align-content:flex-start}
.cbank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1rem}
.chip{background:var(--s3);border:1px solid var(--b2);border-radius:6px;padding:5px 11px;cursor:pointer;font-family:'Fraunces',serif;font-size:.95rem;font-weight:300;color:var(--t1);transition:.1s;user-select:none}
.chip:hover{border-color:var(--ac);color:var(--ac)}
.chip.used{background:var(--ac3);border-color:var(--ac2);color:var(--ac)}
.chip.cok{background:var(--gnb);border-color:var(--gn);color:var(--gnt);cursor:default}
.chip.cbad{background:var(--rdb);border-color:var(--rd);color:var(--rdt);cursor:default}
/* feedback */
.fb{border-radius:var(--rs);padding:.85rem 1rem;margin-bottom:1rem;font-size:13px;line-height:1.55}
.fb.ok{background:var(--gnb);border:1px solid var(--gn);color:var(--gnt)}
.fb.bad{background:var(--rdb);border:1px solid var(--rd);color:var(--rdt)}
.fb .rev{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:300;margin-top:6px;color:var(--t1)}
.arow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* end */
.ewrap{display:flex;flex-direction:column;align-items:center;padding:2.5rem 0;gap:8px}
.escore{font-family:'Fraunces',serif;font-size:5rem;font-weight:600;color:var(--ac);line-height:1}
.emsg{color:var(--t2);font-size:12px}
.ebk{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:1.5rem 0;width:100%;max-width:340px}
.bki{background:var(--s2);border-radius:var(--rs);padding:.9rem;text-align:center}
.bkv{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:300}
.bkl{font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px}
.ebtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>

<div id="pg-home" class="page on">
  <div style="margin-bottom:2rem">
    <div class="logo">Nederlands<em>luisteren</em></div>
    <div class="sub">vježbaj slušanje i vokabular — 160 rečenica za početnike</div>
  </div>
  <div class="lbl">kategorija</div>
  <div class="cgrid" id="cgrid"></div>
  <div class="lbl">vrsta vježbe</div>
  <div class="mlist" id="mlist"></div>
  <div class="srow">
    <div>
      <label>broj pitanja</label>
      <select id="qcount">
        <option value="10">10 pitanja</option>
        <option value="15">15 pitanja</option>
        <option value="20" selected>20 pitanja</option>
        <option value="30">30 pitanja</option>
        <option value="50">50 pitanja</option>
      </select>
    </div>
    <button class="btn" onclick="startSession()">Pocni &rarr;</button>
    <button class="btn gbtn sbtn" onclick="debugTTS()" style="margin-left:4px">&#9654; test zvuk</button>
  </div>
</div>

<div id="pg-ex" class="page">
  <div class="tbar">
    <button class="back" onclick="goHome()">← natrag</button>
    <div class="qc" id="qc">1 / 20</div>
  </div>
  <div class="pw"><div class="pf" id="pf" style="width:0%"></div></div>
  <div id="excontent"></div>
</div>

<div id="pg-end" class="page">
  <div class="ewrap">
    <div style="font-size:11px;color:var(--t3);letter-spacing:2.5px;text-transform:uppercase">sesija završena</div>
    <div class="escore" id="escore">0%</div>
    <div class="emsg" id="emsg"></div>
    <div class="ebk" id="ebk"></div>
    <div class="ebtns">
      <button class="btn" onclick="startSession()">Ponovi</button>
      <button class="btn gbtn" onclick="goHome()">Postavke</button>
    </div>
  </div>
</div>

  {id:"c10",d:"Heeft u de bon nog?",e:"Do you still have the receipt?",c:"Kupnja"},
  {id:"c11",d:"Dit is in de aanbieding.",e:"This is on sale.",c:"Kupnja"},
  {id:"c12",d:"Hoeveel korting is dat?",e:"How much discount is that?",c:"Kupnja"},

  {id:"c15",d:"Is dit van leer?",e:"Is this made of leather?",c:"Kupnja"}

var CATS = [
  {id:"sve",  label:"Sve kategorije", icon:"NL", desc:"Svih 160 recˇenica"},
  {id:"Pozdrav", label:"Pozdrav i osnove", icon:"👋", desc:"30 izraza"},
  {id:"Hrana",   label:"Hrana i pice",    icon:"🍽", desc:"25 izraza"},
  {id:"Smjer",   label:"Putovanje",       icon:"🚆", desc:"25 izraza"},
  {id:"Zivot",   label:"Svakodnevni zivot",icon:"🏠",desc:"30 izraza"},
  {id:"Razgovor",label:"Razgovor",        icon:"💬", desc:"20 izraza"},
  {id:"Hotel",   label:"Hotel",           icon:"🏨", desc:"15 izraza"},
  {id:"Kupnja",  label:"Kupovina",        icon:"🛍", desc:"15 izraza"}
];

var MODES = [
  {id:0, num:"①", t:"Utipkaj sto cujes",   d:"Cues nizozemski i tipkas ga. Najteze i najkorisnije."},
  {id:1, num:"②", t:"Audio → Znacenje",    d:"Cues nizozemski i biras prijevod od 4 opcije."},
  {id:2, num:"③", t:"Slozi recenicu",      d:"Vides engleski i slazˇes nizozemske rijeci."},
  {id:3, num:"④", t:"Mijesano (preporuka)",d:"Automatski mijenja sve tri vrste vjezbi."}
];

var selCat = "sve";
var selMode = 3;
var sess = null;
var curP = null;
var answered = false;
var bAns = [];
var bWords = [];

/* ── TTS ── */
var synth = window.speechSynthesis;
var nlVoice = null;

function initVoices() {
  var voices = synth.getVoices();
  for (var i = 0; i < voices.length; i++) {
    if (voices[i].lang === "nl-NL" || voices[i].lang.indexOf("nl") === 0) {
      nlVoice = voices[i];
      break;
    }
  }
}

if (synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = initVoices;
}
initVoices();
setTimeout(initVoices, 500);
setTimeout(initVoices, 2000);

function speak(text, rate) {
  rate = rate || 1.0;
  initVoices();
  // NO cancel() — Chrome silently drops utterances if cancel+speak in same tick
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "nl-NL";
  u.rate = rate;
  u.pitch = 1.0;
  if (nlVoice) {
    u.voice = nlVoice;
  }
  u.onerror = function(e) { console.log("TTS err:", e.error); };
  u.onstart = function() { console.log("TTS started, voice:", u.voice ? u.voice.name : "default", "lang:", u.lang); };
  synth.speak(u);
}

function debugTTS() {
  var voices = synth.getVoices();
  var msg = "Ukupno glasova: " + voices.length + "\n";
  var nlVoices = voices.filter(function(v){ return v.lang.indexOf("nl") === 0; });
  msg += "NL glasovi: " + nlVoices.length + "\n";
  for(var i=0; i<nlVoices.length; i++) msg += "  - " + nlVoices[i].name + " (" + nlVoices[i].lang + ")\n";
  if(nlVoices.length === 0) msg += "NEMA NL GLASOVA — Chrome nije preuzeo jezicni paket!\n";
  msg += "\nPokusavam reproducirati testnu recenicu...";
  alert(msg);
  var u = new SpeechSynthesisUtterance("Hallo, hoe gaat het?");
  u.lang = "nl-NL";
  synth.speak(u);
}

/* ── NAV ── */
function show(id) {
  var pages = document.querySelectorAll(".page");
  for (var i = 0; i < pages.length; i++) pages[i].classList.remove("on");
  document.getElementById(id).classList.add("on");
}

function goHome() {
  synth.cancel();
  curP = null;
  answered = false;
  show("pg-home");
}

/* ── HOME ── */
function buildHome() {
  var cg = document.getElementById("cgrid");
  cg.innerHTML = "";
  for (var i = 0; i < CATS.length; i++) {
    (function(cat) {
      var d = document.createElement("div");
      d.className = "ccard" + (selCat === cat.id ? " on" : "");
      d.innerHTML = "<span class='ic'>" + cat.icon + "</span><h3>" + cat.label + "</h3><p>" + cat.desc + "</p>";
      d.onclick = function() { selCat = cat.id; buildHome(); };
      cg.appendChild(d);
    })(CATS[i]);
  }

  var ml = document.getElementById("mlist");
  ml.innerHTML = "";
  for (var j = 0; j < MODES.length; j++) {
    (function(m) {
      var b = document.createElement("button");
      b.className = "mbtn" + (selMode === m.id ? " on" : "");
      b.innerHTML = "<span class='mnum'>" + m.num + "</span><div><div class='mtit'>" + m.t + "</div><div class='mdsc'>" + m.d + "</div></div>";
      b.onclick = function() { selMode = m.id; buildHome(); };
      ml.appendChild(b);
    })(MODES[j]);
  }
}

/* ── SESSION ── */
function getPool() {
  if (selCat === "sve") return DATA;
  return DATA.filter(function(p) { return p.c === selCat; });
}

function shuffle(a) {
  var b = a.slice();
  for (var i = b.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = b[i]; b[i] = b[j]; b[j] = tmp;
  }
  return b;
}

function startSession() {
  synth.cancel();
  initVoices();
  var pool = shuffle(getPool());
  var n = Math.min(parseInt(document.getElementById("qcount").value), pool.length);
  sess = { phrases: pool.slice(0, n), idx: 0, correct: 0, total: n };
  show("pg-ex");
  renderQ();
}

function pickMode() {
  return selMode === 3 ? Math.floor(Math.random() * 3) : selMode;
}

/* ── RENDER QUESTION ── */
function renderQ() {
  curP = sess.phrases[sess.idx];
  answered = false;
  bAns = [];
  bWords = [];

  var pct = Math.round(sess.idx / sess.total * 100);
  document.getElementById("pf").style.width = pct + "%";
  document.getElementById("qc").textContent = (sess.idx + 1) + " / " + sess.total;

  var mode = pickMode();
  var el = document.getElementById("excontent");

  if (mode === 0) renderType(el);
  else if (mode === 1) renderMC(el);
  else renderBuilder(el);
}

function audioZoneHTML() {
  return "<div class='azone'>" +
    "<button class='pbig' id='pbig' onclick='speak(curP.d, 1.0)'>&#9654;</button>" +
    "<div class='pbtns'>" +
      "<button class='pbtn' onclick='speak(curP.d, 1.0)'>&#9654; normalno</button>" +
      "<button class='pbtn' onclick='speak(curP.d, 0.6)'>&#9654; sporo</button>" +
    "</div>" +
    "<div class='ahint'>klikni &#9654; za slusanje &middot; sporo = 0.6&times; brzina</div>" +
  "</div>";
}

/* TYPE */
function renderType(el) {
  el.innerHTML = "<div class='ecard'>" +
    "<div class='etype'>&#9312; utipkaj sto cujes</div>" +
    "<div class='cpill'>" + curP.c + "</div>" +
    audioZoneHTML() +
    "<div style='font-size:10px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:7px'>utipkaj na nizozemskom:</div>" +
    "<input class='tinp' id='tinp' type='text' placeholder='...' autocomplete='off' autocorrect='off' autocapitalize='off' spellcheck='false'>" +
    "<div id='fb'></div>" +
    "<div class='arow' id='arow'><button class='btn' onclick='checkType()'>Provjeri</button></div>" +
  "</div>";

  var inp = document.getElementById("tinp");
  if (inp) {
    inp.focus();
    inp.onkeydown = function(e) { if (e.key === "Enter") checkType(); };
  }
}

function norm(s) {
  return s.toLowerCase().trim().replace(/[?.!,'"]/g, "").replace(/\s+/g, " ");
}

function checkType() {
  if (answered) return;
  var inp = document.getElementById("tinp");
  var val = inp ? inp.value.trim() : "";
  if (!val) return;
  var ok = norm(val) === norm(curP.d);
  answered = true;
  inp.classList.add(ok ? "ok" : "bad");
  inp.disabled = true;
  sess.correct += ok ? 1 : 0;
  showFB(ok);
}

/* MC */
function renderMC(el) {
  var others = shuffle(DATA.filter(function(x) { return x.id !== curP.id; })).slice(0, 3);
  var opts = shuffle([curP].concat(others));

  var optsHTML = "";
  for (var i = 0; i < opts.length; i++) {
    optsHTML += "<button class='mco' id='mco" + i + "' data-id='" + opts[i].id + "' onclick='checkMC(" + i + ")'>" + opts[i].e + "</button>";
  }

  el.innerHTML = "<div class='ecard'>" +
    "<div class='etype'>&#9313; audio &rarr; znacenje</div>" +
    "<div class='cpill'>" + curP.c + "</div>" +
    audioZoneHTML() +
    "<div style='font-size:10px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:9px'>odaberi tocan prijevod:</div>" +
    "<div class='mcg'>" + optsHTML + "</div>" +
    "<div id='fb'></div>" +
    "<div class='arow' id='arow'></div>" +
  "</div>";

  window._mcOpts = opts;
}

function checkMC(idx) {
  if (answered) return;
  answered = true;
  var opts = window._mcOpts;
  var chosen = opts[idx];
  var ok = chosen.id === curP.id;
  sess.correct += ok ? 1 : 0;

  var btns = document.querySelectorAll(".mco");
  for (var i = 0; i < btns.length; i++) {
    btns[i].disabled = true;
    if (opts[i].id === curP.id) btns[i].classList.add("ok");
    else if (i === idx && !ok) btns[i].classList.add("bad");
  }
  showFB(ok);
}

/* BUILDER */
function renderBuilder(el) {
  var words = curP.d.split(" ");
  bWords = shuffle(words.map(function(w, i) { return {w: w, oi: i}; }));

  var bankHTML = "";
  for (var i = 0; i < bWords.length; i++) {
    bankHTML += "<button class='chip' id='bc" + i + "' onclick='bAdd(" + i + ")'>" + bWords[i].w + "</button>";
  }

  el.innerHTML = "<div class='ecard'>" +
    "<div class='etype'>&#9314; slozi recenicu</div>" +
    "<div class='cpill'>" + curP.c + "</div>" +
    "<div class='eprompt'>" + curP.e + "</div>" +
    "<div class='blbl'>tvoj odgovor:</div>" +
    "<div class='barea' id='barea'></div>" +
    "<div class='blbl'>rijeci:</div>" +
    "<div class='cbank' id='cbank'>" + bankHTML + "</div>" +
    "<div id='fb'></div>" +
    "<div class='arow' id='arow'>" +
      "<button class='btn' onclick='checkBuilder()'>Provjeri</button>" +
      "<button class='btn gbtn sbtn' onclick='bClear()'>Obrisi</button>" +
    "</div>" +
  "</div>";
}

function bAdd(i) {
  if (answered) return;
  var chip = document.getElementById("bc" + i);
  if (!chip || chip.classList.contains("used")) return;
  chip.classList.add("used");
  bAns.push(i);
  bRender();
}

function bRemove(i) {
  if (answered) return;
  bAns = bAns.filter(function(x) { return x !== i; });
  var bc = document.getElementById("bc" + i);
  if (bc) bc.classList.remove("used");
  bRender();
}

function bClear() {
  if (answered) return;
  bAns = [];
  var chips = document.querySelectorAll(".cbank .chip");
  for (var i = 0; i < chips.length; i++) chips[i].classList.remove("used");
  bRender();
}

function bRender() {
  var area = document.getElementById("barea");
  if (!area) return;
  var html = "";
  for (var i = 0; i < bAns.length; i++) {
    html += "<button class='chip used' onclick='bRemove(" + bAns[i] + ")'>" + bWords[bAns[i]].w + "</button>";
  }
  area.innerHTML = html;
}

function checkBuilder() {
  if (answered || !bAns.length) return;
  var attempt = bAns.map(function(i) { return bWords[i].w; }).join(" ");
  var ok = norm(attempt) === norm(curP.d);
  answered = true;
  speak(curP.d, 1.0);

  var chips = document.querySelectorAll("#barea .chip");
  for (var i = 0; i < chips.length; i++) {
    chips[i].classList.remove("used");
    chips[i].classList.add(ok ? "cok" : "cbad");
  }
  sess.correct += ok ? 1 : 0;
  showFB(ok);
}

/* FEEDBACK */
function showFB(ok) {
  var fb = document.getElementById("fb");
  if (ok) {
    fb.innerHTML = "<div class='fb ok'>&#10003; Tocno!</div>";
  } else {
    fb.innerHTML = "<div class='fb bad'>&#10007; Netocno. Tocan odgovor:<div class='rev'>" + curP.d + "</div></div>";
  }

  var ar = document.getElementById("arow");
  ar.innerHTML = "";
  var nx = document.createElement("button");
  nx.className = "btn";
  nx.textContent = (sess.idx + 1 < sess.total) ? "Sljedece →" : "Zavrsi →";
  nx.onclick = nextQ;
  ar.appendChild(nx);
}

function nextQ() {
  sess.idx++;
  if (sess.idx >= sess.total) { showEnd(); return; }
  renderQ();
}

/* END */
function showEnd() {
  var pct = Math.round(sess.correct / sess.total * 100);
  document.getElementById("escore").textContent = pct + "%";
  var msg = pct >= 90 ? "Sjajno! Pravi Nederlandac." :
            pct >= 70 ? "Vrlo dobro! Nastavi ovako." :
            pct >= 50 ? "Dobar pocetak! Vjezˇbaj dalje." :
                        "Ne brini, ponovi i bit ce bolje!";
  document.getElementById("emsg").textContent = msg;
  document.getElementById("ebk").innerHTML =
    "<div class='bki'><div class='bkv'>" + sess.correct + "</div><div class='bkl'>tocnih</div></div>" +
    "<div class='bki'><div class='bkv'>" + (sess.total - sess.correct) + "</div><div class='bkl'>netocnih</div></div>" +
    "<div class='bki'><div class='bkv'>" + sess.total + "</div><div class='bkl'>ukupno</div></div>";
  show("pg-end");
}

buildHome();
</script>
</body>
</html>
